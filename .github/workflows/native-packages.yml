name: native-packages

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      latest-host: ${{ steps.host.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - id: host
        run: echo "version=$(pnpm view @deepseek-ai/dsh@latest version)" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          node -e "if (!/^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(process.env.GITHUB_REF_NAME)) process.exit(1)"

  build-smoke:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            package-script: package:mac
            electron-cache-paths: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            npm-cache-path: ~/.npm
          - os: windows-2022
            platform: win
            arch: x64
            package-script: package:win
            electron-cache-paths: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
            npm-cache-path: ~/AppData/Local/npm-cache
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            package-script: package:linux
            electron-cache-paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            npm-cache-path: ~/.npm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ matrix.electron-cache-paths }}
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Cache smoke-test npm downloads
        uses: actions/cache@v4
        with:
          path: ${{ matrix.npm-cache-path }}
          key: ${{ runner.os }}-smoke-npm-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-smoke-npm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Install Linux package and smoke dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools xvfb zstd
      - run: pnpm run ${{ matrix.package-script }}
      - name: Smoke every native package with latest dsh
        run: node scripts/native-package-smoke.js --release release --host-version "${{ needs.prepare.outputs.latest-host }}"
      - name: Smoke every native package with minimum supported dsh
        if: needs.prepare.outputs.latest-host != '0.1.1-rc.2'
        run: node scripts/native-package-smoke.js --release release --host-version 0.1.1-rc.2
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [prepare, build-smoke]
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Create checksums
        working-directory: release
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* --draft --title "DSH Desktop ${GITHUB_REF_NAME}" \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
