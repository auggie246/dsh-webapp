<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>DSH Desktop</title>
    <link rel="stylesheet" href="host-bar.css" />
  </head>
  <body>
    <section id="setup" hidden aria-live="polite">
      <h1>Set up dsh</h1>
      <p id="setup-message"></p>
      <code>npm install -g @deepseek-ai/dsh</code>
      <div><button id="retry-dsh">Retry detection</button><button id="pick-dsh">Choose dsh path</button></div>
    </section>
    <nav id="host-bar" aria-label="Host bar">
      <div id="hosts"></div>
      <button id="add" title="Add a Host" aria-label="Add a Host">+</button>
      <form id="port-entry" hidden>
        <input
          id="port-input"
          inputmode="numeric"
          placeholder="Port"
          title="Attach to a Host at port (1–65535). Enter to add, Esc to cancel."
        />
      </form>
    </nav>
    <script src="host-bar.js"></script>
  </body>
</html>
